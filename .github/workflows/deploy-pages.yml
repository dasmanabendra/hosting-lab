# Publishes 01-github-pages/ to GitHub Pages on every push to the default
# branch. Needed because the classic Pages setting can only serve the repo
# root or a /docs folder, not an arbitrary subfolder.
name: Deploy GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: 01-github-pages

      - id: deployment
        uses: actions/deploy-pages@v4

# Reverse proxy: nginx listens on the public port 80/443 and forwards to
# uvicorn, which is only listening on 127.0.0.1:8000 (not reachable from
# the internet directly). certbot rewrites this file to add the TLS block
# once a certificate is issued.

server {
    listen 80;
    server_name _;  # replace with your domain once DNS points here

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Todo List (static)</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 32rem; margin: 2rem auto; padding: 0 1rem; }
    .notice { background: #fff3cd; border: 1px solid #ffe69c; padding: 0.75rem; border-radius: 4px; font-size: 0.9em; margin-bottom: 1.5rem; }
    form.add { display: flex; gap: 0.5rem; margin-bottom: 1.5rem; }
    form.add input { flex: 1; font: inherit; padding: 0.4rem; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 0.6rem; padding: 0.4rem 0; border-bottom: 1px solid #eee; }
    li.done span { text-decoration: line-through; color: #888; }
    button { font: inherit; cursor: pointer; }
    button.check { background: none; border: 1px solid #ccc; border-radius: 50%; width: 1.8rem; height: 1.8rem; }
    button.delete { background: none; border: none; color: #c00; }
    li span { flex: 1; }
  </style>
</head>
<body>
  <h1>Todo List (static)</h1>
  <div class="notice">
    No server here — todos are saved only in <em>your</em> browser's
    <code>localStorage</code>. They'll survive a reload, but not clearing
    your browser data, and not switching to another device. A "personal"
    list still needs a real backend to actually be reliable.
  </div>
  <form class="add" id="form">
    <input id="task" placeholder="What needs doing?" required maxlength="200">
    <button type="submit">Add</button>
  </form>
  <ul id="list"></ul>

  <script>
    const STORAGE_KEY = "todos";

    function loadTodos() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function saveTodos(todos) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function render() {
      const todos = loadTodos();
      const list = document.getElementById("list");
      if (todos.length === 0) {
        list.innerHTML = "<li>Nothing to do — add a task above.</li>";
        return;
      }
      list.innerHTML = todos
        .map(
          (t, i) => `
            <li class="${t.done ? "done" : ""}">
              <button class="check" data-index="${i}" data-action="toggle">${t.done ? "✓" : "○"}</button>
              <span>${escapeHtml(t.task)}</span>
              <button class="delete" data-index="${i}" data-action="delete">✕</button>
            </li>`
        )
        .join("\n");
    }

    document.getElementById("form").addEventListener("submit", (e) => {
      e.preventDefault();
      const input = document.getElementById("task");
      const task = input.value.trim().slice(0, 200);
      if (!task) return;

      const todos = loadTodos();
      todos.push({ task, done: false });
      saveTodos(todos);

      input.value = "";
      render();
    });

    document.getElementById("list").addEventListener("click", (e) => {
      const button = e.target.closest("button[data-action]");
      if (!button) return;
      const index = Number(button.dataset.index);
      const todos = loadTodos();

      if (button.dataset.action === "toggle") {
        todos[index].done = !todos[index].done;
      } else if (button.dataset.action === "delete") {
        todos.splice(index, 1);
      }

      saveTodos(todos);
      render();
    });

    render();
  </script>
</body>
</html>
